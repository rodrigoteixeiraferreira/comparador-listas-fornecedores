# A bateria inteira a cada envio: o gerador, o extrator, os leitores, o portão (51 corrupções) e a prova no banco
# (zero par confirmado errado em 5 mundos fictícios). O banco é o Supabase local, em Docker, com as migrações do
# repositório.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      REQUIRE_DB: "1"  # sem banco, os testes de banco falham em vez de pular
      PSYCOPG_IMPL: binary
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Dependências
        run: pip install -e ".[dev]" "psycopg[binary]"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Banco local com as migrações
        run: supabase db start

      - name: Testes
        run: pytest -ra
