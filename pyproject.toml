[project]
name = "pricelists"
version = "0.1.0"
description = "Comparador de listas de preço de fornecedores: demo reescrita do zero, com dados fictícios"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "fpdf2>=2.8",
    "psycopg>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
